<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="h2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#021D38"/>
      <stop offset="1" stop-color="#003B70"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#h2bg)"/>
  <g opacity="0.9">
    <rect x="0" y="450" width="800" height="150" fill="#0A2E4D"/>
  </g>
  <!-- warehouse racks -->
  <g stroke="#FFFFFF" stroke-width="4" opacity="0.55">
    <line x1="60" y1="120" x2="60" y2="460"/>
    <line x1="200" y1="120" x2="200" y2="460"/>
    <line x1="340" y1="120" x2="340" y2="460"/>
    <line x1="480" y1="120" x2="480" y2="460"/>
    <line x1="620" y1="120" x2="620" y2="460"/>
    <line x1="740" y1="120" x2="740" y2="460"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.35">
    <line x1="40" y1="180" x2="760" y2="180"/>
    <line x1="40" y1="270" x2="760" y2="270"/>
    <line x1="40" y1="360" x2="760" y2="360"/>
  </g>
  <!-- pallets -->
  <g>
    <rect x="75" y="145" width="105" height="30" rx="3" fill="#E30613"/>
    <rect x="355" y="145" width="105" height="30" rx="3" fill="#075995"/>
    <rect x="635" y="145" width="90" height="30" rx="3" fill="#E30613"/>
    <rect x="75" y="235" width="105" height="30" rx="3" fill="#075995"/>
    <rect x="215" y="235" width="105" height="30" rx="3" fill="#F3F6F9"/>
    <rect x="495" y="235" width="105" height="30" rx="3" fill="#E30613"/>
    <rect x="75" y="325" width="105" height="30" rx="3" fill="#F3F6F9"/>
    <rect x="355" y="325" width="105" height="30" rx="3" fill="#075995"/>
    <rect x="635" y="325" width="90" height="30" rx="3" fill="#F3F6F9"/>
  </g>
  <!-- forklift -->
  <g transform="translate(300,400)">
    <rect x="0" y="30" width="90" height="40" rx="6" fill="#E30613"/>
    <rect x="10" y="0" width="10" height="80" fill="#F3F6F9"/>
    <rect x="30" y="0" width="10" height="80" fill="#F3F6F9"/>
    <rect x="0" y="-10" width="45" height="10" fill="#F3F6F9"/>
    <circle cx="20" cy="75" r="12" fill="#021D38"/>
    <circle cx="75" cy="75" r="12" fill="#021D38"/>
  </g>
  <circle cx="700" cy="100" r="60" fill="#FFFFFF" opacity="0.05"/>
</svg>
