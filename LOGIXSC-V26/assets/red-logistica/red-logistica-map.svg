<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="rlBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F6F9"/>
      <stop offset="1" stop-color="#E7EEF5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" rx="18" fill="url(#rlBg)"/>
  <text x="40" y="55" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700" fill="#021D38">Red Logística Integrada</text>
  <text x="40" y="78" font-family="Poppins, Arial, sans-serif" font-size="12.5" letter-spacing="1.5" fill="#075995">ORIGEN → CENTROS DE DISTRIBUCIÓN → PUNTOS DE ENTREGA</text>

  <!-- connection lines -->
  <g stroke="#075995" stroke-width="2.5" fill="none" opacity="0.55">
    <path d="M110 150 C 220 150, 220 260, 330 260"/>
    <path d="M110 260 C 220 260, 220 260, 330 260"/>
    <path d="M110 370 C 220 370, 220 260, 330 260"/>
    <path d="M330 260 C 430 260, 430 150, 520 150"/>
    <path d="M330 260 C 430 260, 430 260, 520 260"/>
    <path d="M330 260 C 430 260, 430 370, 520 370"/>
    <path d="M330 260 C 430 260, 430 470, 520 470"/>
  </g>
  <g stroke="#E30613" stroke-width="2" fill="none" stroke-dasharray="6 6" opacity="0.6">
    <path d="M520 150 C 600 150, 600 200, 680 200"/>
    <path d="M520 260 C 600 260, 600 240, 680 240"/>
    <path d="M520 370 C 600 370, 600 320, 680 320"/>
  </g>

  <!-- origin nodes -->
  <g font-family="Poppins, Arial, sans-serif" font-size="12" fill="#021D38">
    <g transform="translate(70,150)">
      <circle r="24" fill="#003B70"/>
      <circle r="24" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">GRANJA</text>
    </g>
    <g transform="translate(70,260)">
      <circle r="24" fill="#003B70"/>
      <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700">PLANTA</text>
    </g>
    <g transform="translate(70,370)">
      <circle r="24" fill="#003B70"/>
      <text x="0" y="-1" text-anchor="middle" fill="#FFFFFF" font-size="8.5" font-weight="700">PUERTO /</text>
      <text x="0" y="9" text-anchor="middle" fill="#FFFFFF" font-size="8.5" font-weight="700">INSUMOS</text>
    </g>
  </g>

  <!-- hub node -->
  <g transform="translate(330,260)">
    <circle r="36" fill="#E30613"/>
    <text x="0" y="-2" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">HUB</text>
    <text x="0" y="12" text-anchor="middle" fill="#FFFFFF" font-size="8.5" font-weight="700">LOGÍSTICO</text>
  </g>

  <!-- distribution centers -->
  <g font-family="Poppins, Arial, sans-serif" fill="#FFFFFF">
    <g transform="translate(520,150)">
      <rect x="-30" y="-20" width="60" height="40" rx="8" fill="#075995"/>
      <text x="0" y="-2" text-anchor="middle" font-size="8.5" font-weight="700">CD</text>
      <text x="0" y="10" text-anchor="middle" font-size="7.5">NORTE</text>
    </g>
    <g transform="translate(520,260)">
      <rect x="-30" y="-20" width="60" height="40" rx="8" fill="#075995"/>
      <text x="0" y="-2" text-anchor="middle" font-size="8.5" font-weight="700">CD</text>
      <text x="0" y="10" text-anchor="middle" font-size="7.5">CENTRO</text>
    </g>
    <g transform="translate(520,370)">
      <rect x="-30" y="-20" width="60" height="40" rx="8" fill="#075995"/>
      <text x="0" y="-2" text-anchor="middle" font-size="8.5" font-weight="700">CD</text>
      <text x="0" y="10" text-anchor="middle" font-size="7.5">SUR</text>
    </g>
    <g transform="translate(520,470)">
      <rect x="-30" y="-20" width="60" height="40" rx="8" fill="#075995"/>
      <text x="0" y="-2" text-anchor="middle" font-size="8.5" font-weight="700">CD</text>
      <text x="0" y="10" text-anchor="middle" font-size="7.5">ORIENTE</text>
    </g>
  </g>

  <!-- delivery points -->
  <g fill="#021D38">
    <circle cx="680" cy="200" r="8" fill="#F3F6F9" stroke="#075995" stroke-width="2.5"/>
    <circle cx="680" cy="240" r="8" fill="#F3F6F9" stroke="#075995" stroke-width="2.5"/>
    <circle cx="680" cy="320" r="8" fill="#F3F6F9" stroke="#075995" stroke-width="2.5"/>
    <text x="700" y="204" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#021D38">Clientes</text>
    <text x="700" y="244" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#021D38">Puntos de venta</text>
    <text x="700" y="324" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#021D38">Operaciones</text>
  </g>

  <g font-family="Poppins, Arial, sans-serif" font-size="10.5" fill="#075995">
    <circle cx="40" cy="520" r="5" fill="#003B70"/>
    <text x="52" y="524">Origen</text>
    <circle cx="130" cy="520" r="5" fill="#E30613"/>
    <text x="142" y="524">Hub logístico</text>
    <circle cx="250" cy="520" r="5" fill="#075995"/>
    <text x="262" y="524">Centro de distribución</text>
    <circle cx="420" cy="520" r="5" fill="#F3F6F9" stroke="#075995" stroke-width="2"/>
    <text x="432" y="524">Punto de entrega</text>
  </g>
</svg>
